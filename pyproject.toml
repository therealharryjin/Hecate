[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hecate"
version = "0.1.0"
description = "A local-first, encrypted command-line password manager"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23",
    "pyotp>=2.9",
    "click>=8.1",
    "requests>=2.31",
    "pyperclip>=1.8",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hecate = "hecate.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
